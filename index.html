<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS2 demo — iToF × Stereo RGB</title>
<style>
  :root { --bar: 48px; --bg: #15151a; --fg: #e8e8ee; --dim: #9a9aa8; --line: #2a2a33; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { height: var(--bar); box-sizing: border-box; display: flex; align-items: center; gap: 16px;
    padding: 0 16px; border-bottom: 1px solid var(--line); }
  header .logo { display: flex; align-items: center; height: 100%; }
  header .logo img { height: 22px; width: auto; display: block; }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header h1 span { color: var(--dim); font-weight: 400; margin-left: 8px; }
  header nav { margin-left: auto; display: flex; gap: 16px; font-size: 13px; white-space: nowrap; }
  header nav a { color: var(--dim); text-decoration: none; }
  header nav a:hover { color: var(--fg); }
  iframe { display: block; width: 100%; height: calc(100% - var(--bar)); border: 0; }
  @media (max-width: 640px) { header h1 span, header nav .full { display: none; } }
</style>
<script>
  // First visit: turn on loop playback and close the left sidebar (Lichtblick workspace state; left alone if already set)
  try {
    if (!localStorage.getItem("fox.workspace")) {
      localStorage.setItem("fox.workspace", JSON.stringify({ version: 1, state: {
        playbackControls: { repeat: true, syncInstances: false },
        sidebars: { left: { item: "panel-settings", open: false }, right: { open: false } } } }));
    }
  } catch (e) {}
  var base = location.href.replace(/[?#].*$/, "").replace(/[^/]*$/, "");
  var file = "data/ps2-demo-261112_160209-en.mcap";
  // GitHub Pages gzips .mcap and applies Range to the compressed bytes, so the recording is read from raw.githubusercontent.com.
  // ?data=local (or any host other than github.io) reads the file from this site; ?raw=<owner>/<repo> reads that repository's raw file.
  var m = location.hostname.match(/^([^.]+)\.github\.io$/), repo = location.pathname.split("/")[1];
  var useRaw = m && repo && !/[?&]data=local/.test(location.search);
  var rawOwner = (location.search.match(/[?&]raw=([^&/]+\/[^&/]+)/) || [])[1];
  var mcap = rawOwner ? "https://raw.githubusercontent.com/" + rawOwner + "/main/" + file
           : useRaw ? "https://raw.githubusercontent.com/" + m[1] + "/" + repo + "/main/" + file : base + file;
  var layout = base + "layouts/PS2-Demo-v4.json";
  var app = base + "app/?ds=remote-file&ds.url=" + encodeURIComponent(mcap) + "&layoutUrl=" + encodeURIComponent(layout);
</script>
</head>
<body>
<header>
  <a class="logo" href="https://telelian.com" target="_blank" rel="noopener" title="telelian.com">
    <img src="assets/telelian-logo.png" alt="Telelian">
  </a>
  <h1>PS2 demo<span>iToF × Stereo RGB · Lichtblick</span></h1>
  <nav>
    <a class="full" id="full" href="app/" target="_blank" rel="noopener">Open full screen</a>
    <a href="https://telelian.com" target="_blank" rel="noopener">telelian.com</a>
  </nav>
</header>
<iframe id="app" title="Lichtblick" allow="fullscreen; autoplay; clipboard-write"></iframe>
<script>
  document.getElementById("app").src = app;
  document.getElementById("full").href = app;
</script>
</body>
</html>
